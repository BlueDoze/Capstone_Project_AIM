		function doorToLatLng(doorElement, svgMap, corners) {
			const bbox = doorElement.getBBox();
			const doorCenterX = bbox.x + bbox.width / 2;
			const doorCenterY = bbox.y + bbox.height / 2;

			const svgBBox = svgMap.viewBox.baseVal || {
				x: 0,
				y: 0,
				width: svgMap.width.baseVal.value,
				height: svgMap.height.baseVal.value
			};

			const normX = (doorCenterX - svgBBox.x) / svgBBox.width;
			const normY = (doorCenterY - svgBBox.y) / svgBBox.height;

			const topLeft = corners[0], topRight = corners[1],
				bottomRight = corners[2], bottomLeft = corners[3];

			const latTop = topLeft.lat + normX * (topRight.lat - topLeft.lat);
			const lngTop = topLeft.lng + normX * (topRight.lng - topLeft.lng);
			const latBottom = bottomLeft.lat + normX * (bottomRight.lat - bottomLeft.lat);
			const lngBottom = bottomLeft.lng + normX * (bottomRight.lng - bottomLeft.lng);

			const doorLat = latTop + normY * (latBottom - latTop);
			const doorLng = lngTop + normY * (lngBottom - lngTop);

			return L.latLng(doorLat, doorLng);
		}
		
		function rotatePoint(point, center, angleDeg){
			const angleRad = (angleDeg * Math.PI) / 180;
			const cos = Math.cos(angleRad);
			const sin = Math.sin(angleRad);

			const dx = point.lng - center.lng;
			const dy = point.lat - center.lat;

			return L.latLng(
				center.lat + (dy * cos -dx * sin),
				center.lng + (dx *cos + dy * sin)
			);
		}

        //Node finding function
        function findNearestNode(position, nodePositions) {
            let nearestNode = null;
            let minDistance = Infinity;
            
            Object.entries(nodePositions).forEach(([nodeId, nodePos]) => {
                const distance = position.distanceTo(nodePos);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestNode = nodeId;
                }
            });
            
            console.log(`📍 Nearest node to user: ${nearestNode} (${minDistance.toFixed(2)}m away)`);
            return nearestNode;
        }
		
        // Convert SVG circle node to lat/lng (similar to doorToLatLng but for circles)
        function nodeToLatLng(nodeElement, svgMap, corners) {
            const cx = parseFloat(nodeElement.getAttribute('cx'));
            const cy = parseFloat(nodeElement.getAttribute('cy'));
            
            const svgBBox = svgMap.viewBox.baseVal || {
                x: 0,
                y: 0,
                width: svgMap.width.baseVal.value,
                height: svgMap.height.baseVal.value
            };

            const normX = (cx - svgBBox.x) / svgBBox.width;
            const normY = (cy - svgBBox.y) / svgBBox.height;

            const topLeft = corners[0], topRight = corners[1],
                bottomRight = corners[2], bottomLeft = corners[3];

            const latTop = topLeft.lat + normX * (topRight.lat - topLeft.lat);
            const lngTop = topLeft.lng + normX * (topRight.lng - topLeft.lng);
            const latBottom = bottomLeft.lat + normX * (bottomRight.lat - bottomLeft.lat);
            const lngBottom = bottomLeft.lng + normX * (bottomRight.lng - bottomLeft.lng);

            const nodeLat = latTop + normY * (latBottom - latTop);
            const nodeLng = lngTop + normY * (lngBottom - lngTop);

            return L.latLng(nodeLat, nodeLng);
        }

        // Build navigation graph from definition
        function buildNavigationGraph(svgMap, graphDefinition, corners) {
            const graph = {};
            const nodePositions = {};
            const nodeMetadata = {};
            
            console.log("🔨 Building navigation graph...");
            
            Object.entries(graphDefinition).forEach(([nodeId, nodeData]) => {
                const nodeElement = svgMap.getElementById(nodeId);
                
                if (nodeElement) {
                    nodePositions[nodeId] = nodeToLatLng(nodeElement, svgMap, corners);
                    nodeMetadata[nodeId] = {
                        connections: nodeData.connections || [],
                        represents: nodeData.represents || null
                    };
                    console.log(`✓ Found node: ${nodeId}`);
                } else {
                    console.error(`✗ Node ${nodeId} NOT FOUND in SVG!`);
                }
            });
            
            Object.entries(nodeMetadata).forEach(([nodeId, data]) => {
                if (!nodePositions[nodeId]) return;
                
                graph[nodeId] = data.connections.map(connectedId => {
                    if (!nodePositions[connectedId]) {
                        console.warn(`⚠️ Connected node ${connectedId} not found`);
                        return null;
                    }
                    
                    const distance = nodePositions[nodeId].distanceTo(nodePositions[connectedId]);
                    return { node: connectedId, distance: distance };
                }).filter(n => n !== null);
            });
            
            console.log("✅ Navigation graph built!");
            console.log(`   Nodes: ${Object.keys(nodePositions).length}`);
            
            return { graph, nodePositions, nodeMetadata };
        }

        // Dijkstra's Algorithm
        function findShortestPath(graph, startNode, endNode) {
            console.log(`🔍 Finding path: ${startNode} → ${endNode}`);
            
            if (!graph[startNode] || !graph[endNode]) {
                console.error(`❌ Invalid start/end node`);
                return null;
            }
            
            const distances = {};
            const previous = {};
            const unvisited = new Set(Object.keys(graph));
            
            Object.keys(graph).forEach(node => {
                distances[node] = Infinity;
            });
            distances[startNode] = 0;
            
            while (unvisited.size > 0) {
                let currentNode = null;
                let minDistance = Infinity;
                unvisited.forEach(node => {
                    if (distances[node] < minDistance) {
                        minDistance = distances[node];
                        currentNode = node;
                    }
                });
                
                if (currentNode === null || currentNode === endNode) break;
                
                unvisited.delete(currentNode);
                
                if (graph[currentNode]) {
                    graph[currentNode].forEach(({ node, distance }) => {
                        const newDistance = distances[currentNode] + distance;
                        if (newDistance < distances[node]) {
                            distances[node] = newDistance;
                            previous[node] = currentNode;
                        }
                    });
                }
            }
            
            const path = [];
            let current = endNode;
            while (current) {
                path.unshift(current);
                current = previous[current];
            }
            
            if (path[0] !== startNode) {
                console.warn("❌ No path found!");
                return null;
            }
            
            console.log(`✅ Path: ${path.join(' → ')}`);
            return path;
        }

        // Find path to object
        function findPathToObject(objectType, objectId, startPosition, graphData) {
            console.log(`🎯 Finding path to ${objectType}: ${objectId}`);
            
            const { graph, nodePositions, nodeMetadata } = graphData;
            
            let destinationNode = null;
            
            Object.entries(nodeMetadata).forEach(([nodeId, data]) => {
                if (!data.represents) return;
                
                const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                
                represents.forEach(rep => {
                    if (rep.type === objectType && rep.id === objectId) {
                        destinationNode = nodeId;
                    }
                });
            });
            
            if (!destinationNode) {
                console.error(`❌ No node for ${objectId}`);
                alert(`No navigation node for ${objectId}`);
                return null;
            }
            
            const startNode = findNearestNode(startPosition, nodePositions);
            const path = findShortestPath(graph, startNode, destinationNode);
            
            return path;
        }

        function updateOverlayPosition() {
            if (!window.currentOverlay || !window.overlayBasePosition) {
                alert("No overlay loaded!");
                return;
            }
            
            const latOffset = parseFloat(document.getElementById('latOffset').value) || 0;
            const lngOffset = parseFloat(document.getElementById('lngOffset').value) || 0;
            const scale = parseFloat(document.getElementById('scaleOffset').value) || 1;
            const rotation = parseFloat(document.getElementById('rotationOffset').value) || 0;
            
            const base = window.overlayBasePosition;
            
            // Calculate scaled bounds
            const centerLat = (base.north + base.south) / 2;
            const centerLng = (base.east + base.west) / 2;
            
            const halfHeight = ((base.north - base.south) / 2) * scale;
            const halfWidth = ((base.east - base.west) / 2) * scale;
            
            const newBounds = L.latLngBounds(
                [centerLat - halfHeight + latOffset, centerLng - halfWidth + lngOffset],
                [centerLat + halfHeight + latOffset, centerLng + halfWidth + lngOffset]
            );
            
            // Remove old overlay
            window.map.removeLayer(window.currentOverlay);
            
            // Clone the original SVG element to avoid cumulative rotations
            const svgClone = window.originalSvgElement.cloneNode(true);
            
            // Apply rotation INSIDE the SVG (not CSS)
            if (rotation !== 0) {
                const viewBox = svgClone.viewBox.baseVal;
                const centerX = viewBox.x + viewBox.width / 2;
                const centerY = viewBox.y + viewBox.height / 2;
                
                // Wrap all content in a rotated group
                const innerContent = svgClone.innerHTML;
                svgClone.innerHTML = `<g transform="rotate(${rotation}, ${centerX}, ${centerY})">${innerContent}</g>`;
            }
            
            // Create new overlay with adjusted bounds
            window.currentOverlay = L.svgOverlay(svgClone, newBounds, { 
                interactive: true, 
                opacity: 0.5 
            }).addTo(window.map);
            
            // Store the current SVG for interactive elements (if needed)
            window.currentSvgElement = svgClone;
        }

        function setupOverlayDrag() {
            window.map.on('mousedown', function(e) {
                // Only start drag if Shift is held and we have an overlay
                if (!e.originalEvent.shiftKey || !window.currentOverlay) return;
                
                // Check if click is roughly within the overlay bounds
                const bounds = window.currentOverlay.getBounds();
                if (bounds.contains(e.latlng)) {
                    window.isDraggingOverlay = true;
                    window.dragStartLatLng = e.latlng;
                    window.dragStartOffsets = {
                        lat: parseFloat(document.getElementById('latOffset').value) || 0,
                        lng: parseFloat(document.getElementById('lngOffset').value) || 0
                    };
                    
                    // Disable map dragging while we drag the overlay
                    window.map.dragging.disable();
                    
                    // Change cursor
                    window.map.getContainer().style.cursor = 'grabbing';
                }
            });

            window.map.on('mousemove', function(e) {
                if (!window.isDraggingOverlay || !window.dragStartLatLng) return;
                
                // Calculate how far the mouse moved
                const latDiff = e.latlng.lat - window.dragStartLatLng.lat;
                const lngDiff = e.latlng.lng - window.dragStartLatLng.lng;
                
                // Update offset inputs
                const newLatOffset = window.dragStartOffsets.lat + latDiff;

            let latOffset = parseFloat(document.getElementById('latOffset').value) || 0;
            let lngOffset = parseFloat(document.getElementById('lngOffset').value) || 0;
            
            switch(e.key) {
                case 'ArrowUp':
                    latOffset += step;
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    latOffset -= step;
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    lngOffset -= step;
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    lngOffset += step;
                    e.preventDefault();
                    break;
                default:
                    return;
            }
            
            document.getElementById('latOffset').value = latOffset.toFixed(6);
            document.getElementById('lngOffset').value = lngOffset.toFixed(6);
