            });

            map.on('mousemove touchmove', function() {
                if (Date.now() - window.dragStartTime > 100) { // If movement lasts > 100ms, it's a drag
                    window.isDragging = true;
                }
            });

            map.on('mouseup touchend', function() {
                setTimeout(() => {
                    window.isDragging = false;
                }, 50); // Small delay to ensure click events see the drag state
            });

            // Step 2: Add tile layer (the actual map)
            L.tileLayer(
                "https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=d3JSA6Uq18jaERqMgDqq",
                {
                attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
                maxZoom: 22
                }
            ).addTo(map);
            


            window.currentOverlay = null;

            window.hallwayLatLngs = []; // store hallway nodes globally
            window.currentPathLine = null;

            
            // Step 3: Load GeoJSON buildings

            if (window.geojsonData){
                window.geojsonData.features.forEach(feature => {
                    if (feature.geometry.type === "Polygon" || feature.geometry.type === "MultiPolygon") {
                        const tempLayer = L.geoJSON(feature);
                        const bounds = tempLayer.getBounds();
                        const buildingName = feature.properties.name || "Unknown Building";
                        
                        if (buildingName !== "Unknown Building") {
                            window.buildingInfoCache[buildingName] = {
                                layer: tempLayer,
                                bounds: bounds,
                                feature: feature
                            };
                            console.log("✅ Cached:", buildingName);
                        }
                    }
                });

                L.geoJSON(window.geojsonData, {
                        style: {
                            color: "blue",
                            weight: 2,
                            fillOpacity: 0.2
                        },
                        onEachFeature: function(feature, layer) {
                            let buildingName = feature.properties.name || "Unknown Building";
                            layer.bindPopup("<b>" + buildingName + "</b>");
                            
                            // Optional: Add click handler for individual building zoom
                            layer.on('click', function() {
                                const bounds = layer.getBounds();
                                map.fitBounds(bounds);
                            });
                        }
                    }).addTo(map);
                }

                // Load the first floor on startup
                // await loadFloorLevel(1);
                // createUserMarker(L.latLng(43.0143425, -81.19856355)); // Starting position in M building
                // updateUserLocation();
                showStartupModal();


                
                // Set Start Position Button
                document.getElementById("setStartBtn").addEventListener("click", () => {
                    const objectId = document.getElementById("startObjectId").value.trim();
                    
                    if (!objectId) {
                        alert("Please enter a Start Position (Room or Exit ID)");
                        return;
                    }
                    
                    console.log(`🔍 Setting start position to: ${objectId}`);
                    
                    // Search through all buildings for the object
                    let found = false;
                    let targetBuilding = null;
                    let targetFloor = null;
                    let startNode = null;
                    
                    Object.entries(window.floorPlans).forEach(([buildingName, buildingInfo]) => {
                        if (found) return;
                        
                        Object.entries(buildingInfo.floors).forEach(([floorKey, floorData]) => {
                            if (found) return;
                            
                            // Check rooms
                            if (floorData.objects && floorData.objects.rooms && floorData.objects.rooms[objectId]) {
                                found = true;
                                targetBuilding = buildingName;
                                targetFloor = floorKey;
                                
                                // Find the node that represents this room (should be at door)
                                const graphData = window.buildingGraphData[buildingName];
                                if (graphData) {
                                    Object.entries(graphData.nodeMetadata).forEach(([nodeId, data]) => {
                                        if (!data.represents) return;
                                        const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                                        represents.forEach(rep => {
                                            if (rep.id === objectId) {
                                                startNode = nodeId;
                                            }
                                        });
                                    });
                                }
                            }
                            
                            // Check exits
                            if (floorData.objects && floorData.objects.exits && floorData.objects.exits[objectId]) {
                                found = true;
                                targetBuilding = buildingName;
                                targetFloor = floorKey;
                                
                                // Find the node that represents this exit
                                const graphData = window.buildingGraphData[buildingName];
                                if (graphData) {
                                    Object.entries(graphData.nodeMetadata).forEach(([nodeId, data]) => {
                                        if (!data.represents) return;
                                        const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                                        represents.forEach(rep => {
                                            if (rep.id === objectId) {
                                                startNode = nodeId;
                                            }
                                        });
                                    });
                                }
                            }
                        });
                    });
                    
                    if (!found) {
                        alert(`Object "${objectId}" not found in any building.`);
                        return;
                    }
                    
                    if (!startNode) {
                        alert(`Found ${objectId} in ${targetBuilding} Floor ${targetFloor}, but no navigation node exists for it.`);
                        return;
                    }
                    
                    // Get the position of the start node
                    const graphData = window.buildingGraphData[targetBuilding];
                    if (graphData && graphData.nodePositions[startNode]) {
                        const position = graphData.nodePositions[startNode];
                        
                        // Set user position to this node
                        createUserMarker(position);
                        window.userCurrentBuilding = targetBuilding;
                        window.userCurrentFloor = targetFloor;
                        
                        // Load the correct floor if not already loaded
                        loadFloorLevel(parseInt(targetFloor));
                        
                        // Center map on this position
                        map.setView(position, 20);
                        
                        alert(`✅ Start position set to ${objectId} in ${targetBuilding}, Floor ${targetFloor}`);
                        console.log(`✅ User position set to node ${startNode}:`, position);
                    } else {
                        alert("Could not get position for this object");
                    }
                });
                
                // Navigate to Destination Button
                document.getElementById("navigateBtn").addEventListener("click", () => {
                    const objectId = document.getElementById("destinationObjectId").value.trim();
                    
                    if (!objectId) {
                        alert("Please enter an Object ID");
                        return;
                    }
                    
                    console.log(`🔍 Searching for object: ${objectId}`);
                    
                    // Search through all buildings for the object
                    let found = false;
                    let targetBuilding = null;
                    let targetFloor = null;
                    let destinationNode = null;
                    
                    Object.entries(window.floorPlans).forEach(([buildingName, buildingInfo]) => {
                        if (found) return;
                        
                        Object.entries(buildingInfo.floors).forEach(([floorKey, floorData]) => {
                            if (found) return;
                            
                            // Check rooms
                            if (floorData.objects && floorData.objects.rooms && floorData.objects.rooms[objectId]) {
                                found = true;
                                targetBuilding = buildingName;
                                targetFloor = floorKey;
                                
                                // Find the closest node that represents this room
                                const graphData = window.buildingGraphData[buildingName];
                                if (graphData) {
                                    const candidateNodes = [];
                                    Object.entries(graphData.nodeMetadata).forEach(([nodeId, data]) => {
                                        if (!data.represents) return;
                                        const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                                        represents.forEach(rep => {
                                            if (rep.id === objectId) {
                                                candidateNodes.push(nodeId);
                                            }
                                        });
                                    });
                                    
                                    // Select closest node to user
                                    if (candidateNodes.length > 0) {
                                        let minDist = Infinity;
                                        candidateNodes.forEach(nodeId => {
                                            const nodePos = graphData.nodePositions[nodeId];
                                            if (nodePos) {
                                                const dist = window.userPosition.distanceTo(nodePos);
                                                if (dist < minDist) {
                                                    minDist = dist;
                                                    destinationNode = nodeId;
                                                }
                                            }
                                        });
                                    }
                                }
                            }
                            
                            // Check exits
                            if (floorData.objects && floorData.objects.exits && floorData.objects.exits[objectId]) {
                                found = true;
                                targetBuilding = buildingName;
                                targetFloor = floorKey;
                                
                                // Find the closest node that represents this exit
                                const graphData = window.buildingGraphData[buildingName];
                                if (graphData) {
                                    const candidateNodes = [];
                                    Object.entries(graphData.nodeMetadata).forEach(([nodeId, data]) => {
                                        if (!data.represents) return;
                                        const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                                        represents.forEach(rep => {
                                            if (rep.id === objectId) {
                                                candidateNodes.push(nodeId);
                                            }
                                        });
                                    });
                                    
                                    // Select closest node to user
                                    if (candidateNodes.length > 0) {
                                        let minDist = Infinity;
                                        candidateNodes.forEach(nodeId => {
                                            const nodePos = graphData.nodePositions[nodeId];
                                            if (nodePos) {
                                                const dist = window.userPosition.distanceTo(nodePos);
                                                if (dist < minDist) {
                                                    minDist = dist;
                                                    destinationNode = nodeId;
                                                }
                                            }
                                        });
                                    }
                                }
                            }
                        });
                    });
                    
                    if (!found) {
                        alert(`Object "${objectId}" not found in any building.`);
                        return;
                    }
                    
                    if (!destinationNode) {
                        alert(`Found ${objectId} in ${targetBuilding} Floor ${targetFloor}, but no navigation node exists for it.`);
                        return;
                    }
                    
                    console.log(`✅ Found ${objectId} in ${targetBuilding}, Floor ${targetFloor}, Node: ${destinationNode}`);
                    
                    // Get user's current location
                    const userLocation = updateUserLocation();
                    
                    // Find path
                    const pathResult = findPathAcrossBuildings(
                        userLocation.building || targetBuilding,
                        userLocation.floor || "1",
                        targetBuilding,
                        targetFloor,
                        destinationNode
                    );
                    
                    if (pathResult) {
                        if (pathResult.type === 'single-building') {
                            const graphData = window.buildingGraphData[targetBuilding];
                            const svgMap = window.buildingSVGElements[targetBuilding];
                            
                            if (pathResult.path && pathResult.path.length > 0) {
                                drawPathOnMap(pathResult.path, graphData.nodePositions, map, svgMap);
                                alert(`✅ Navigating to ${objectId} in ${targetBuilding}`);
                            } else {
                                alert("Could not generate path");
                            }
                        } else if (pathResult.type === 'multi-building') {
                            alert(`Route: ${pathResult.segments.map(s => s.description).join(' → ')}`);
                            drawMultiBuildingPath(pathResult);
                        }
                    } else {
                        alert(`Could not find path to ${objectId}`);
                    }
                });
        }
        initApp();
		
    </script>
	
</body>
</html>
