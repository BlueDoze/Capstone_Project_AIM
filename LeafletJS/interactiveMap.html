    <script>
		

        window.originalExitStyles = new Map();

        // Add these variables at the top with your other globals
        window.isDraggingOverlay = false;
        window.dragStartLatLng = null;
        window.dragStartOffsets = null;
        window.overlayBasePosition = null;
        

        window.userPosition = L.latLng(43.0143425, -81.19856355); // Starting position
        window.userMarker = null;
        window.locationMode = 'manual'; // 'manual' or 'gps'
        window.gpsWatchId = null;
        window.gpsMarker = null;
        window.gpsAccuracyCircle = null;
        window.GPS_ACCURACY_THRESHOLD = 20;


        //Persistence functions using sessionStorage (clears when browser closes)
        function saveUserState() {
            // Save path data if it exists
            const pathData = [];
            if (window.pathPolylines && window.pathPolylines.length > 0) {
                window.pathPolylines.forEach(polyline => {
                    const latLngs = polyline.getLatLngs().map(ll => ({lat: ll.lat, lng: ll.lng}));
                    pathData.push(latLngs);
                });
            }
            
            const state = {
                floor: window.userCurrentFloor,
                position: {
                    lat: window.userPosition.lat,
                    lng: window.userPosition.lng
                },
                mode: window.locationMode,
                paths: pathData,
                highlightedNodes: window.highlightedNodes || []
            };
            sessionStorage.setItem('campusMapState', JSON.stringify(state));
            console.log('💾 User state saved:', state);
        }

        function loadUserState() {
            try {
                const saved = sessionStorage.getItem('campusMapState');
                if (!saved) return null;
                
                const state = JSON.parse(saved);
                
                // Validate structure
                if (!state.floor || !state.position || !state.mode) {
                    console.warn('⚠️ Invalid saved state structure');
                    return null;
                }
                
                // Validate floor is valid (1-3)
                if (!["1", "2", "3", 1, 2, 3].includes(state.floor)) {
                    console.warn('⚠️ Invalid floor number:', state.floor);
                    return null;
                }
                
                // Validate position has lat/lng
                if (typeof state.position.lat !== 'number' || typeof state.position.lng !== 'number') {
                    console.warn('⚠️ Invalid position coordinates');
                    return null;
                }
                
                // Ensure paths and highlightedNodes exist (backwards compatibility)
                state.paths = state.paths || [];
                state.highlightedNodes = state.highlightedNodes || [];
                
                console.log('✅ Loaded saved state:', state);
                return state;
            } catch (error) {
                console.error('❌ Error loading saved state:', error);
                return null;
            }
        }

        function clearUserState() {
            sessionStorage.removeItem('campusMapState');
            console.log('🗑️ User state cleared');
        }

        //Functions

        function clearPath() {
            console.log("🗑️ Clearing path...");
            
            // Clear the red polylines (path lines) from map
            if (window.pathPolylines) {
                window.pathPolylines.forEach(line => map.removeLayer(line));
                window.pathPolylines = [];
            }
            
            // Clear highlighted nodes (green start, yellow middle, red end)
            if (window.highlightedNodes && window.buildingSVGElements) {
                Object.values(window.buildingSVGElements).forEach(svgElement => {
                    window.highlightedNodes.forEach(nodeId => {
                        const node = svgElement.getElementById(nodeId);
                        if (node) {
                            node.style.fill = '';
                            node.style.stroke = '';
                            node.style.strokeWidth = '';
                        }
                    });
                });
                window.highlightedNodes = [];
            }
            
            console.log("✅ Path cleared!");
            
            // Save state after clearing path
            saveUserState();
        }

        function changeFloor() {
            const newFloor = document.getElementById('floor-selector').value;
            
            // Clear any existing paths when switching floors
            clearPath();
            
            // Update the current floor
            console.log(`🔄 Changing to floor ${newFloor}`);
            window.userCurrentFloor = newFloor;
            
            // Load the new floor
            loadFloorLevel(parseInt(newFloor));
            
            // Save state with new floor
            saveUserState();
            
            console.log(`✅ Floor changed to ${newFloor}`);
        }

        function toggleLocationMode() {
            if (window.locationMode === 'manual') {
                // Switch to GPS mode
                startGPSTracking();
            } else {
                // Switch to manual mode
                stopGPSTracking();
            }
        }

        function startGPSTracking() {
            if (!navigator.geolocation) {
                alert("❌ GPS not supported by your browser");
                return;
            }
            
            const statusEl = document.getElementById('location-status');
            const btn = document.getElementById('location-mode-btn');
            
            statusEl.textContent = "🔄 Starting GPS tracking...";
            btn.textContent = "📍 Switch to Manual";
            btn.style.background = "#dc3545";
            
            window.locationMode = 'gps';
            
            // Hide manual marker, make it non-draggable
            if (window.userMarker) {
                window.userMarker.dragging.disable();
            }
            
            window.gpsWatchId = navigator.geolocation.watchPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    const altitude = position.coords.altitude;
                    
                    console.log(`📍 GPS Update: [${lat}, ${lng}] Accuracy: ±${accuracy.toFixed(0)}m`);
                    
                    // ✅ CHECK ACCURACY THRESHOLD
                    if (accuracy > window.GPS_ACCURACY_THRESHOLD) {
                        console.warn(`⚠️ GPS accuracy too low: ${accuracy.toFixed(0)}m (threshold: ${window.GPS_ACCURACY_THRESHOLD}m)`);
                        
                        statusEl.innerHTML = `⚠️ Poor GPS Signal<br>Accuracy: ±${accuracy.toFixed(0)}m<br>(Threshold: ${window.GPS_ACCURACY_THRESHOLD}m)<br><b>Using last known position</b>`;
                        
                        // Change accuracy circle to red to indicate poor signal
                        if (window.gpsAccuracyCircle) {
                            window.gpsAccuracyCircle.setStyle({
                                color: '#ff4444',
                                fillColor: '#ff4444'
                            });
                        }
                        
                        // Don't update position if accuracy is too poor
                        // Optionally: auto-switch to manual after X failed readings
                        return;
                    }
                    
                    const latlng = L.latLng(lat, lng);
                    
                    // Update status (green = good signal)
                    let statusText = `✅ GPS Active<br>Accuracy: ±${accuracy.toFixed(0)}m`;
                    if (altitude !== null) {
                        statusText += `<br>Alt: ${altitude.toFixed(1)}m`;
                    }
                    statusEl.innerHTML = statusText;
                    
                    // Update or create GPS marker
                    if (!window.gpsMarker) {
                        // Remove manual marker
                        if (window.userMarker) {
                            map.removeLayer(window.userMarker);
                        }
                        
                        // Create GPS accuracy circle (blue = good signal)
                        window.gpsAccuracyCircle = L.circle(latlng, {
                            radius: accuracy,
                            color: '#0066cc',
                            fillColor: '#0066cc',
                            fillOpacity: 0.15,
                            weight: 2
                        }).addTo(map);
                        
                        // Create GPS marker
                        const gpsIcon = L.divIcon({
                            className: 'gps-location-marker',
                            html: `<div style="width:20px;height:20px;background:#0066cc;border:3px solid white;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,0.3);"></div>`,
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });
                        
                        window.gpsMarker = L.marker(latlng, { icon: gpsIcon }).addTo(map);
                        window.gpsMarker.bindPopup("<b>📍 GPS Location</b><br>Tracking active").openPopup();
                    } else {
                        // Update existing markers
                        window.gpsMarker.setLatLng(latlng);
                        window.gpsAccuracyCircle.setLatLng(latlng);
                        window.gpsAccuracyCircle.setRadius(accuracy);
                        
                        // Reset color to blue (good signal)
                        window.gpsAccuracyCircle.setStyle({
                            color: '#0066cc',
                            fillColor: '#0066cc'
                        });
                    }
                    
                    // Update global user position
                    window.userPosition = latlng;
                    updateUserLocation();
                    
                    // Optionally center map on user (can be toggled)
                    // map.setView(latlng, map.getZoom());
                },
                function(error) {
                    console.error("GPS Error:", error);
                    statusEl.innerHTML = `❌ GPS Error<br>${error.message}`;
                    
                    // Fall back to manual mode
                    stopGPSTracking();
                    alert("GPS tracking failed. Switched to manual mode.");
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 5000
                }
            );
        }

        function stopGPSTracking() {
            if (window.gpsWatchId !== null) {
                navigator.geolocation.clearWatch(window.gpsWatchId);
                window.gpsWatchId = null;
            }
            
            // Remove GPS markers
            if (window.gpsMarker) {
                map.removeLayer(window.gpsMarker);
                window.gpsMarker = null;
            }
            if (window.gpsAccuracyCircle) {
                map.removeLayer(window.gpsAccuracyCircle);
                window.gpsAccuracyCircle = null;
            }
            
            window.locationMode = 'manual';
            
            const statusEl = document.getElementById('location-status');
            const btn = document.getElementById('location-mode-btn');
            
            statusEl.innerHTML = "📍 Manual Mode";
            btn.textContent = "🛰️ Switch to GPS";
            btn.style.background = "#0066cc";
            
            // Recreate manual marker
            if (!window.userMarker) {
                createUserMarker(window.userPosition);
            } else {
                map.addLayer(window.userMarker);
                window.userMarker.dragging.enable();
            }
        }

        function debugShowNodePositions(buildingName) {
            const graphData = window.buildingGraphData[buildingName];
            
            if (!graphData) {
                console.error(`No graph data for ${buildingName}`);
                return;
            }
            
            // Clear old debug markers
            if (window.debugNodeMarkers) {
                window.debugNodeMarkers.forEach(marker => map.removeLayer(marker));
            }
            window.debugNodeMarkers = [];
            
            // Add markers at calculated positions
            Object.entries(graphData.nodePositions).forEach(([nodeId, position]) => {
                const marker = L.circleMarker(position, {
                    radius: 5,
                    color: 'red',
                    fillColor: 'yellow',
                    fillOpacity: 0.9,
                    weight: 2
                }).addTo(map);
                
                marker.bindPopup(`
                    <b>Node: ${nodeId}</b><br>
                    Lat: ${position.lat.toFixed(6)}<br>
                    Lng: ${position.lng.toFixed(6)}
                `);
                
                window.debugNodeMarkers.push(marker);
            });
            
            console.log(`✅ Showing ${Object.keys(graphData.nodePositions).length} node markers for ${buildingName}`);
            console.log(`💡 Check if markers align with visual nodes in the SVG overlay`);
        }

        function createUserMarker(latlng) {
        // Remove existing marker if it exists
        if (window.userMarker) {
            map.removeLayer(window.userMarker);
        }
        
        window.userPosition = latlng;
        window.userMarker = L.marker(latlng, {
            icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            }),
            draggable: true,
            title: "Your Location"
        }).addTo(map);
        
        window.userMarker.bindPopup("<b>📍 You are here</b>").openPopup();
        
        // Update position when dragged
        window.userMarker.on('dragend', function(e) {
            window.userPosition = e.target.getLatLng();
            console.log("📍 User position updated:", window.userPosition);
            
            // Determine which building/floor user is in
            updateUserLocation();
        });
        
        console.log("✅ User marker created at:", latlng);
    }

        // Determine which building and floor the user is currently in
        function updateUserLocation() {
            let userBuilding = null;
            let userFloor = null;
            
            // Check which building the user is in
            Object.entries(window.buildingInfoCache).forEach(([buildingName, buildingData]) => {
                if (buildingData.bounds.contains(window.userPosition)) {
                    userBuilding = buildingName;
                    // For now, assume they're on floor 1 (later we can add floor detection)
                    userFloor = "1";
                    console.log(`👤 User is in ${buildingName}, Floor ${userFloor}`);
                }
            });
            
            if (!userBuilding) {
                console.log("👤 User is outside all buildings");
            }
            
            // Store globally
            window.userCurrentBuilding = userBuilding;
            window.userCurrentFloor = userFloor;
            
            return { building: userBuilding, floor: userFloor };
        }
        
        function clearAllHighlights(svgMap) {
            svgMap.querySelectorAll('.highlighted-door').forEach(prevDoor => {
                prevDoor.classList.remove('highlighted-door');
                prevDoor.style.stroke = '';
                prevDoor.style.strokeWidth = '';
            });

            svgMap.querySelectorAll('.highlighted-exit').forEach(prevExit => {
                restoreOriginalExitStyle(prevExit);
                prevExit.classList.remove('highlighted-exit');
            });
        }

        function highlightDoors(svgMap, doorList) {
            if (doorList.length > 0) {
                doorList.forEach(doorId => {
                    const door = svgMap.getElementById(doorId);
                    if (door) {
                        door.classList.add('highlighted-door');
                        door.style.stroke = 'red';
                        door.style.strokeWidth = '3px';
                    }
                });
            }
        }

        // Store original styles for exits
        function storeOriginalExitStyle(element) {
            if (!window.originalExitStyles.has(element.id)) {
                window.originalExitStyles.set(element.id, {
                    stroke: element.style.stroke || element.getAttribute('stroke') || '',
                    strokeWidth: element.style.strokeWidth || element.getAttribute('stroke-width') || '',
                    fill: element.style.fill || element.getAttribute('fill') || ''
                });
            }
        }
        // Restore original styles for exits
        function restoreOriginalExitStyle(element) {
            const original = window.originalExitStyles.get(element.id);
            if (original) {
                element.style.stroke = original.stroke;
                element.style.strokeWidth = original.strokeWidth;
                element.style.fill = original.fill;
            }
        }

        function clearPlans(){
            map.eachLayer(layer => {
                if (layer instanceof L.SVGOverlay) {
                    map.removeLayer(layer);
                }
            });
        }

		function openFloorPlan() {
			let select = document.getElementById("floorSelect");
			let filePath = select.value;
			window.open(filePath, "_blank"); // open in new tab
		}

		function doorToLatLng(doorElement, svgMap, corners) {
			const bbox = doorElement.getBBox();
			const doorCenterX = bbox.x + bbox.width / 2;
			const doorCenterY = bbox.y + bbox.height / 2;

			const svgBBox = svgMap.viewBox.baseVal || {
				x: 0,
				y: 0,
				width: svgMap.width.baseVal.value,
				height: svgMap.height.baseVal.value
			};

			const normX = (doorCenterX - svgBBox.x) / svgBBox.width;
			const normY = (doorCenterY - svgBBox.y) / svgBBox.height;

			const topLeft = corners[0], topRight = corners[1],
				bottomRight = corners[2], bottomLeft = corners[3];

			const latTop = topLeft.lat + normX * (topRight.lat - topLeft.lat);
			const lngTop = topLeft.lng + normX * (topRight.lng - topLeft.lng);
			const latBottom = bottomLeft.lat + normX * (bottomRight.lat - bottomLeft.lat);
			const lngBottom = bottomLeft.lng + normX * (bottomRight.lng - bottomLeft.lng);

			const doorLat = latTop + normY * (latBottom - latTop);
			const doorLng = lngTop + normY * (lngBottom - lngTop);

			return L.latLng(doorLat, doorLng);
		}

        //Rotation based functions
		function updateMapBearing() {
			const input = document.getElementById('bearingInput');
			const newBearing = parseFloat(input.value) || 0;
			window.map.setBearing(newBearing);
			
			// Update any existing overlays
			if (window.currentOverlay) {

        //Pathfinding functions

        //Node finding function
        function findNearestNode(position, nodePositions) {
            let nearestNode = null;
            let minDistance = Infinity;
            
            Object.entries(nodePositions).forEach(([nodeId, nodePos]) => {
                const distance = position.distanceTo(nodePos);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestNode = nodeId;
                }
            });
            
            console.log(`📍 Nearest node to user: ${nearestNode} (${minDistance.toFixed(2)}m away)`);
            return nearestNode;
        }
		
        // Convert SVG circle node to lat/lng (similar to doorToLatLng but for circles)
        function nodeToLatLng(nodeElement, svgMap, overlay) {
            // Get the actual rendered position of the node in screen coordinates
            const svgPoint = svgMap.createSVGPoint();
            svgPoint.x = parseFloat(nodeElement.getAttribute('cx'));
            svgPoint.y = parseFloat(nodeElement.getAttribute('cy'));
            
            // Transform through any applied transforms (including rotation)
            const ctm = nodeElement.getCTM();
            const transformedPoint = svgPoint.matrixTransform(ctm);
            
            // Get the SVG element's bounding box in screen space
            const svgRect = svgMap.getBoundingClientRect();
            const overlayBounds = overlay.getBounds();
            
            // Calculate normalized position within the SVG (0 to 1)
            const normX = transformedPoint.x / svgRect.width;
            const normY = transformedPoint.y / svgRect.height;
            
            // Map to geographic coordinates
            const west = overlayBounds.getWest();
            const east = overlayBounds.getEast();
            const north = overlayBounds.getNorth();
            const south = overlayBounds.getSouth();
            
            const lng = west + normX * (east - west);
            const lat = north - normY * (north - south); // Note: Y is inverted in screen coordinates
            
            return L.latLng(lat, lng);
        }

        // Convert door/exit SVG element to lat/lng (for final destination)
        function objectToLatLng(objectElement, svgMap, overlay) {
            // Get bounding box of the object (works for rectangles, polygons, circles, etc.)
            const bbox = objectElement.getBBox();
            const centerX = bbox.x + bbox.width / 2;
            const centerY = bbox.y + bbox.height / 2;
            
            // Create SVG point at center
            const svgPoint = svgMap.createSVGPoint();
            svgPoint.x = centerX;
            svgPoint.y = centerY;
            
            // Transform through any applied transforms
            const ctm = objectElement.getCTM();
            const transformedPoint = svgPoint.matrixTransform(ctm);
            
            // Get the SVG element's bounding box in screen space
            const svgRect = svgMap.getBoundingClientRect();
            const overlayBounds = overlay.getBounds();
            
            // Calculate normalized position within the SVG (0 to 1)
            const normX = transformedPoint.x / svgRect.width;
            const normY = transformedPoint.y / svgRect.height;
            
            // Map to geographic coordinates
            const west = overlayBounds.getWest();
            const east = overlayBounds.getEast();
            const north = overlayBounds.getNorth();
            const south = overlayBounds.getSouth();
            
            const lng = west + normX * (east - west);
            const lat = north - normY * (north - south);
            
            console.log(`📍 Object center: [${lat.toFixed(6)}, ${lng.toFixed(6)}]`);
            return L.latLng(lat, lng);
        }

        // Build navigation graph from definition
        function buildNavigationGraph(svgMap, graphDefinition, overlay) {
            const graph = {};
            const nodePositions = {};
            const nodeMetadata = {};
            
            console.log("🔨 Building navigation graph...");
            
    
            Object.entries(graphDefinition).forEach(([nodeId, nodeData]) => {
                const nodeElement = svgMap.getElementById(nodeId);
                
                if (nodeElement) {
                    const geoPosition = nodeToLatLng(nodeElement, svgMap, overlay);
                    nodePositions[nodeId] = geoPosition;
                    
                    nodeMetadata[nodeId] = {
                        connections: nodeData.connections || [],
                        represents: nodeData.represents || null,
                        svgPosition: {
                            cx: parseFloat(nodeElement.getAttribute('cx')),
                            cy: parseFloat(nodeElement.getAttribute('cy'))
                        }
                    };
                    console.log(`✓ Node ${nodeId}: ${geoPosition.lat.toFixed(6)}, ${geoPosition.lng.toFixed(6)}`);
                } else {
                    console.error(`✗ Node ${nodeId} NOT FOUND in SVG!`);
                }
            });
            
            // Build graph connections after all positions are calculated
            Object.entries(nodeMetadata).forEach(([nodeId, data]) => {
                if (!nodePositions[nodeId]) return;
                
                graph[nodeId] = data.connections.map(connectedId => {
                    if (!nodePositions[connectedId]) {
                        console.warn(`⚠️ Connected node ${connectedId} not found`);
                        return null;
                    }
                    
                    const distance = nodePositions[nodeId].distanceTo(nodePositions[connectedId]);
                    return { node: connectedId, distance: distance };
                }).filter(n => n !== null);
            });
            
            console.log("✅ Navigation graph built with geo-locations!");
            console.log(`   Nodes: ${Object.keys(nodePositions).length}`);
            console.log(`   Sample position:`, Object.entries(nodePositions)[0]);
            
            
            return { graph, nodePositions, nodeMetadata };
        }

        // Dijkstra's Algorithm
        function findShortestPath(graph, startNode, endNode) {
            console.log(`🔍 Finding path: ${startNode} → ${endNode}`);
            
            if (!graph[startNode] || !graph[endNode]) {
                console.error(`❌ Invalid start/end node`);
                return null;
            }
            
            const distances = {};
            const previous = {};
            const unvisited = new Set(Object.keys(graph));
            
            Object.keys(graph).forEach(node => {
                distances[node] = Infinity;
            });
            distances[startNode] = 0;
            
            while (unvisited.size > 0) {
                let currentNode = null;
                let minDistance = Infinity;
                unvisited.forEach(node => {
                    if (distances[node] < minDistance) {
                        minDistance = distances[node];
                        currentNode = node;
                    }
                });
                
                if (currentNode === null || currentNode === endNode) break;
                
                unvisited.delete(currentNode);
                
                if (graph[currentNode]) {
                    graph[currentNode].forEach(({ node, distance }) => {
                        const newDistance = distances[currentNode] + distance;
                        if (newDistance < distances[node]) {
                            distances[node] = newDistance;
                            previous[node] = currentNode;
                        }
                    });
                }
            }
            
            const path = [];
            let current = endNode;
            while (current) {
                path.unshift(current);
                current = previous[current];
            }
            
            if (path[0] !== startNode) {
                console.warn("❌ No path found!");
                return null;
            }
            
            console.log(`✅ Path: ${path.join(' → ')}`);
            return path;
        }

        function drawPathOnMap(path, nodePositions, map, svgMap, clearPrevious = true, finalObjectId = null, overlay = null) {
            console.log("🎨 Drawing path in SVG...");
            console.log("Path:", path);
            if (finalObjectId) {
                console.log("🎯 Final destination object:", finalObjectId);
            }
            
            // Only clear if requested
            if (clearPrevious) {
                if (window.pathPolylines) {
                    window.pathPolylines.forEach(line => map.removeLayer(line));
                }
                window.pathPolylines = [];
                
                if (window.highlightedNodes) {
                    window.highlightedNodes.forEach(nodeId => {
                        const node = svgMap.getElementById(nodeId);
                        if (node) {
                            node.style.fill = '';
                            node.style.stroke = '';
                            node.style.strokeWidth = '';
                        }
                    });
                }
                window.highlightedNodes = [];
            }

            // Clear previous highlights from SVG nodes
            if (window.highlightedNodes) {
                window.highlightedNodes.forEach(nodeId => {
                    const node = svgMap.getElementById(nodeId);
                    if (node) {
                        node.style.fill = '';
                        node.style.stroke = '';
                        node.style.strokeWidth = '';
                    }
                });
            }
            window.highlightedNodes = [];

            if (!path || path.length === 0) {
                console.error("❌ No path!");
                alert("No path found!");
                return;
            }
            
            const latLngs = path.map(nodeId => nodePositions[nodeId]).filter(pos => pos);
    
            if (latLngs.length < 2) {
                console.error("❌ Not enough valid positions for path");
                return;
            }

            // Draw main path (nodes to nodes)
            const pathLine = L.polyline(latLngs, {
                color: '#FF0000',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10',
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);
            
            window.pathPolylines.push(pathLine);
            console.log(`✅ Drew polyline with ${latLngs.length} points`);

            // Draw final line from last node to actual object center
            if (finalObjectId && overlay) {
                const finalObject = svgMap.getElementById(finalObjectId);
                if (finalObject) {
                    const objectCenter = objectToLatLng(finalObject, svgMap, overlay);
                    const lastNodePosition = latLngs[latLngs.length - 1];
                    
                    const finalLine = L.polyline([lastNodePosition, objectCenter], {
                        color: '#0000FF',  // Blue to distinguish from main path
                        weight: 4,
                        opacity: 0.9,
                        dashArray: '5, 5',
                        lineCap: 'round',
                        lineJoin: 'round'
                    }).addTo(map);
                    
                    window.pathPolylines.push(finalLine);
                    console.log(`✅ Drew final line to object center: ${finalObjectId}`);
                    
                    // Add a destination marker at the object center
                    const destMarker = L.circleMarker(objectCenter, {
                        radius: 8,
                        color: '#0000FF',
                        fillColor: '#0000FF',
                        fillOpacity: 0.7,
                        weight: 2
                    }).addTo(map);
                    
                    destMarker.bindPopup(`<b>🎯 Destination</b><br>${finalObjectId}`);
                    window.pathPolylines.push(destMarker);
                } else {
                    console.warn(`⚠️ Final object ${finalObjectId} not found in SVG`);
                }
            }

            // Highlight each node in the path
            path.forEach((nodeId, index) => {
                const node = svgMap.getElementById(nodeId);
                if (node) {
                    // Bring node to front by re-appending it
                    node.parentNode.appendChild(node);
                    
                    // Start node = green, end node = red, middle nodes = yellow
                    if (index === 0) {
                        node.style.fill = '#00FF00';
                        node.style.stroke = '#00AA00';
                    } else if (index === path.length - 1) {
                        node.style.fill = '#FF0000';
                        node.style.stroke = '#AA0000';
                    } else {
                        node.style.fill = '#FFFF00';
                        node.style.stroke = '#AAAA00';
                    }
                    node.style.strokeWidth = '2';
                    //node.setAttribute('r', '1');  // Make nodes bigger
                    window.highlightedNodes.push(nodeId);
                    console.log(`✅ Highlighted node ${index}: ${nodeId}`);
                } else {
                    console.error(`❌ Node ${nodeId} not found in SVG!`);
                }
            });
            
            //console.log(`✅ Drew ${window.pathLines.length} path lines in SVG!`);
            //console.log(`✅ Highlighted ${window.highlightedNodes.length} nodes!`);
        }

        // Find path to object
        function findPathToObject(objectType, objectId, startPosition, graphData) {
            console.log(`🎯 Finding path to ${objectType}: ${objectId}`);
            
            const { graph, nodePositions, nodeMetadata } = graphData;
            
            let destinationNode = null;
            
            Object.entries(nodeMetadata).forEach(([nodeId, data]) => {
                if (!data.represents) return;
                
                const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                
                represents.forEach(rep => {
                    if (rep.type === objectType && rep.id === objectId) {
                        destinationNode = nodeId;
                    }
                });
            });
            
            if (!destinationNode) {
                console.error(`❌ No node for ${objectId}`);
                alert(`No navigation node for ${objectId}`);
                return null;
            }
            
            const startNode = findNearestNode(startPosition, nodePositions);
            const path = findShortestPath(graph, startNode, destinationNode);
            
            return path;
        }

        function updateOverlayPosition() {
            if (!window.currentOverlay || !window.overlayBasePosition) {
                alert("No overlay loaded!");
                return;
            }
            
            const latOffset = parseFloat(document.getElementById('latOffset').value) || 0;
            const lngOffset = parseFloat(document.getElementById('lngOffset').value) || 0;
            const scale = parseFloat(document.getElementById('scaleOffset').value) || 1;
            const rotation = parseFloat(document.getElementById('rotationOffset').value) || 0;
            
            const base = window.overlayBasePosition;
            
            // Calculate scaled bounds
            const centerLat = (base.north + base.south) / 2;
            const centerLng = (base.east + base.west) / 2;
            
            const halfHeight = ((base.north - base.south) / 2) * scale;
            const halfWidth = ((base.east - base.west) / 2) * scale;
            
            const newBounds = L.latLngBounds(
                [centerLat - halfHeight + latOffset, centerLng - halfWidth + lngOffset],
                [centerLat + halfHeight + latOffset, centerLng + halfWidth + lngOffset]
            );
            
            // Remove old overlay
            window.map.removeLayer(window.currentOverlay);
            
            // Clone the original SVG element to avoid cumulative rotations
            const svgClone = window.originalSvgElement.cloneNode(true);
            
            // Apply rotation INSIDE the SVG (not CSS)
            if (rotation !== 0) {
                const viewBox = svgClone.viewBox.baseVal;
                const centerX = viewBox.x + viewBox.width / 2;
                const centerY = viewBox.y + viewBox.height / 2;
                
                // Wrap all content in a rotated group
                const innerContent = svgClone.innerHTML;
                svgClone.innerHTML = `<g transform="rotate(${rotation}, ${centerX}, ${centerY})">${innerContent}</g>`;
            }
            
            // Create new overlay with adjusted bounds
            window.currentOverlay = L.svgOverlay(svgClone, newBounds, { 
                interactive: true, 
                opacity: 0.5 
            }).addTo(window.map);
            
            // Store the current SVG for interactive elements (if needed)
            window.currentSvgElement = svgClone;
        }

        function setupOverlayDrag() {
            window.map.on('mousedown', function(e) {
                // Only start drag if Shift is held and we have an overlay
                if (!e.originalEvent.shiftKey || !window.currentOverlay) return;
                
                // Check if click is roughly within the overlay bounds
                const bounds = window.currentOverlay.getBounds();
                if (bounds.contains(e.latlng)) {
                    window.isDraggingOverlay = true;
                    window.dragStartLatLng = e.latlng;
                    window.dragStartOffsets = {
                        lat: parseFloat(document.getElementById('latOffset').value) || 0,
                        lng: parseFloat(document.getElementById('lngOffset').value) || 0
                    };
                    
                    // Disable map dragging while we drag the overlay
                    window.map.dragging.disable();
                    
                    // Change cursor
                    window.map.getContainer().style.cursor = 'grabbing';
                }
            });

            window.map.on('mousemove', function(e) {
                if (!window.isDraggingOverlay || !window.dragStartLatLng) return;
                
                // Calculate how far the mouse moved
                const latDiff = e.latlng.lat - window.dragStartLatLng.lat;
                const lngDiff = e.latlng.lng - window.dragStartLatLng.lng;
                
                // Update offset inputs
                const newLatOffset = window.dragStartOffsets.lat + latDiff;
                const newLngOffset = window.dragStartOffsets.lng + lngDiff;
                
                document.getElementById('latOffset').value = newLatOffset.toFixed(6);
                document.getElementById('lngOffset').value = newLngOffset.toFixed(6);
                
                // Update overlay position
                updateOverlayPosition();
            });

            window.map.on('mouseup', function(e) {
                if (window.isDraggingOverlay) {
                    window.isDraggingOverlay = false;
                    window.dragStartLatLng = null;
                    window.dragStartOffsets = null;
                    
                    // Re-enable map dragging
                    window.map.dragging.enable();
                    
                    // Reset cursor
                    window.map.getContainer().style.cursor = '';
                }
            });
        }

                            "1",                                     // Destination floor (hardcoded for now)
                            destinationNode                          // Destination node
                        );

                        if (pathResult) {

                                    doorList.forEach((doorId, index) => {

                                    console.log(`✅ Selected closest door: ${closestDoorId} (${minDistance.toFixed(2)}m away)`);
                                    
                                    // Use the closest door as the final destination
                                    const finalDoorId = closestDoorId || (doorList && doorList.length > 0 ? doorList[0] : null);
                                    
                                    drawPathOnMap(pathResult.path, graphData.nodePositions, map, svgMap, true, finalDoorId, buildingOverlay);

                                    alert("Could not generate path");

                                // ✅ Draw multi-building path (both segments)
                                // TODO: Add finalObjectId support for multi-building paths
                                drawMultiBuildingPath(pathResult);

                                alert(`Could not find path to ${roomId}`)
                            }
                        } else {

        function setupExitInteractivity(svgMap, exits, graphData, buildingName) {
            Object.entries(exits).forEach(([exitId, destinationsList]) => {
                const exit = svgMap.getElementById(exitId);
                
                if (exit) {
                    exit.style.pointerEvents = 'all';
                    exit.style.cursor = 'pointer';
                    exit.addEventListener('click', (e) => {
                        e.stopPropagation();
                        
                        if (window.isDragging) {
                            console.log("Ignoring click - user was dragging");
                            return;
                        }
                        
                        console.log(`🚪 ${exitId} clicked!`);
                        const userConfirmed = confirm(`You clicked ${exitId}. Would you like directions?`);
                        if (!userConfirmed) {
                            console.log("User declined directions");
                            return;
                        }

                        // Clear previous highlights
                        clearAllHighlights(svgMap);

                        // Store and highlight exit
                        storeOriginalExitStyle(exit);
                        exit.classList.add('highlighted-exit');
                        exit.style.stroke = 'blue';
                        exit.style.strokeWidth = '3px';
                        exit.style.fill = 'rgba(0, 0, 255, 0.3)';

                        // Find destination node for this exit - select closest if multiple exist
                        console.log(`🎯 Finding best node for exit: ${exitId}`);
                        
                        // Collect all nodes that represent this exit
                        const candidateNodes = [];
                        Object.entries(graphData.nodeMetadata).forEach(([nodeId, data]) => {
                            if (!data.represents) return;
                            const represents = Array.isArray(data.represents) ? data.represents : [data.represents];
                            represents.forEach(rep => {
                                if (rep.id === exitId) {
                                    candidateNodes.push({ nodeId, goesTo: rep.goesTo });
                                }
                            });
                        });

                        if (candidateNodes.length === 0) {
                            console.error(`❌ No nodes found for ${exitId}`);
                            alert(`No navigation node for ${exitId}`);
                            return;
                        }
                        
                        console.log(`📍 Found ${candidateNodes.length} node(s) for ${exitId}:`, candidateNodes);
                        
                        // Select the closest node to user's position
                        let destinationNode = null;
                        let minDistance = Infinity;
                        
                        candidateNodes.forEach(({ nodeId, goesTo }) => {
                            const nodePos = graphData.nodePositions[nodeId];
                            if (nodePos) {
                                const distance = window.userPosition.distanceTo(nodePos);
                                console.log(`   Node ${nodeId} (→ ${goesTo || 'N/A'}): ${distance.toFixed(2)}m away`);
                                
                                if (distance < minDistance) {
                                    minDistance = distance;
                                    destinationNode = nodeId;
                                }
                            }
                        });
                        
                        console.log(`✅ Selected closest node: ${destinationNode} (${minDistance.toFixed(2)}m away)`);

                        if (!destinationNode) {
                            console.error(`❌ Could not determine best node for ${exitId}`);
                            alert(`Navigation error for ${exitId}`);
                            return;
                        }

                        // Get user's current location
                        const userLocation = updateUserLocation();

                        // Find path using the multi-building pathfinding
                        const pathResult = findPathAcrossBuildings(
                            userLocation.building || buildingName,  // Current building
                            userLocation.floor || "1",               // Current floor
                            buildingName,                            // Destination building
                            "1",                                     // Destination floor (hardcoded for now)
                            destinationNode                          // Destination node
                        );

                        if (pathResult) {
                            if (pathResult.type === 'single-building') {
                                if (pathResult.path && pathResult.path.length > 0) {
                                    // For exits, the exit itself is the final destination
                                    const finalExitId = exitId;
                                    
                                    // Get the overlay for this building
                                    const buildingOverlay = window.currentOverlays.find(overlay => {
                                        return overlay.getElement().querySelector(`#${buildingName}`);
                                    }) || window.currentOverlays[0];
                                    
                                    drawPathOnMap(pathResult.path, graphData.nodePositions, map, svgMap, true, finalExitId, buildingOverlay);
                                } else {
                                    console.error("❌ Path is empty!");
                                    alert("Could not generate path");
                                }
                            } else if (pathResult.type === 'multi-building') {
                                console.log("📍 Multi-building path:", pathResult);
                                alert(`Route: ${pathResult.segments.map(s => s.description).join(' → ')}`);
                                
                                // Draw multi-building path (both segments)
                                drawMultiBuildingPath(pathResult);
                            }
                        } else {
                            alert(`Could not find path to ${exitId}`);
                        }
                    });
                } else {
                    console.warn(`⚠️ Exit ${exitId} not found in SVG`);
                }
            });
        }

        // Loading entire floor level (All floorplans for a specific floor level)
        
        function loadFloorLevel(floorKey) {
            if (!window.floorPlans || Object.keys(window.floorPlans).length === 0) {
                console.error('❌ Floor plans not loaded yet!');
                alert('Floor plans are still loading. Please wait a moment and try again.');
                return;
            }

            if (!window.geojsonData || !window.geojsonData.features) {
                console.error('❌ GeoJSON not loaded yet!');
                return;
            }
            
            // Remove any previous overlays
            clearPlans();
            window.currentOverlays.forEach(ov => map.removeLayer(ov));
            window.currentOverlays = [];

            console.log(`🔄 Loading floor ${floorKey}...`);
            
            let loadedCount = 0;
            let skippedCount = 0;
            const totalBuildings = Object.keys(window.floorPlans).length;
            
            Object.entries(window.floorPlans).forEach(([buildingName, buildingInfo]) => {
                // ✅ CHECK: Does this building have data for the requested floor?
                if (!buildingInfo["floors"][floorKey]) {
                    console.log(`⚠️ Skipping ${buildingName} - No data for floor ${floorKey}`);
                    skippedCount++;
                    return;
                }

                // Getting Building path
                let prePath = buildingInfo["path"];
                let fileName = buildingInfo["floors"][floorKey]["plan"];
                let svgPath = "/leaflet-assets/" + prePath + "/" + fileName + "?ts=" + new Date().getTime();
                
                let baseBounds = window.buildingInfoCache[buildingName]["bounds"];
                let adjustedBounds = baseBounds;
                let rotation = 0;

                // Position adjustments
                if (window.buildingPositions && 
                    window.buildingPositions[buildingName] &&
                    window.buildingPositions[buildingName][floorKey]) {
                    const adjustments = window.buildingPositions[buildingName][floorKey]["positionAdjustments"];
                    
                    if (adjustments) {
                        console.log(`🔧 Applying adjustments for ${buildingName} Floor ${floorKey}:`, adjustments);
                        
                        const latOffset = adjustments.latOffset || 0;
                        const lngOffset = adjustments.lngOffset || 0;
                        const scale = adjustments.scale || 1;
                        rotation = adjustments.rotation || 0;
                        
                        const centerLat = (baseBounds.getNorth() + baseBounds.getSouth()) / 2;
                        const centerLng = (baseBounds.getEast() + baseBounds.getWest()) / 2;
                        
                        const halfHeight = ((baseBounds.getNorth() - baseBounds.getSouth()) / 2) * scale;
                        const halfWidth = ((baseBounds.getEast() - baseBounds.getWest()) / 2) * scale;
                        
                        adjustedBounds = L.latLngBounds(
                            [centerLat - halfHeight + latOffset, centerLng - halfWidth + lngOffset],
                            [centerLat + halfHeight + latOffset, centerLng + halfWidth + lngOffset]
                        );
                    }
                }

                let corners = [
                    L.latLng(adjustedBounds.getNorth(), adjustedBounds.getWest()),
                    L.latLng(adjustedBounds.getNorth(), adjustedBounds.getEast()),
                    L.latLng(adjustedBounds.getSouth(), adjustedBounds.getEast()),
                    L.latLng(adjustedBounds.getSouth(), adjustedBounds.getWest())
                ];

                fetch(svgPath)
                    .then(r => {
                        if (!r.ok) {
                            console.warn(`⚠️ SVG file for ${buildingName} not found (${r.status})`);
                            skippedCount++;
                            return null;
                        }
                        return r.text();
                    })
                    .then(svgText => {
                        if (!svgText) return;
                        
                        const svgDoc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
                        const svgMap = svgDoc.documentElement;
                        
                        // Check for parsing errors
                        if (svgMap.querySelector('parsererror')) {
                            console.error(`❌ Failed to parse SVG for ${buildingName}`);
                            skippedCount++;
                            return;
                        }
                        
                        // Apply rotation if needed
                        if (rotation !== 0) {
                            const viewBox = svgMap.viewBox.baseVal;
                            const centerX = viewBox.x + viewBox.width / 2;
                            const centerY = viewBox.y + viewBox.height / 2;
                            
                            const innerContent = svgMap.innerHTML;
                            svgMap.innerHTML = `<g transform="rotate(${rotation}, ${centerX}, ${centerY})">${innerContent}</g>`;
                            
                            console.log(`🔄 Applied ${rotation}° rotation to ${buildingName}`);
                        }

                        // DON'T create custom panes - let Leaflet use defaults
                        // The overlayPane has z-index 400 by default, which is good
                        
                        let newOverlay = L.svgOverlay(svgMap, corners, {
                            interactive: true,
                            opacity: 0.5
                            // Removed pane parameter - use default overlayPane
                        }).addTo(map);
                        
                        window.currentOverlays.push(newOverlay);

                        if (!window.buildingSVGElements) {
                            window.buildingSVGElements = {};
                        }
                        window.buildingSVGElements[buildingName] = svgMap;

                        const floorData = buildingInfo["floors"][floorKey];

                        if (floorData["navigationGraph"]) {
                            const navigationGraph = floorData["navigationGraph"];
                            const rooms = floorData["objects"]["rooms"];
                            const exits = floorData["objects"]["exits"];

                            // Add small delay to ensure SVG is rendered
                            setTimeout(() => {
                                const graphData = buildNavigationGraph(svgMap, navigationGraph, newOverlay);

                                if (!window.buildingGraphData) {
                                    window.buildingGraphData = {};
                                }

                                window.buildingGraphData[buildingName] = graphData;
                                
                                console.log(`✅ Stored geo-locations for ${buildingName}:`, 
                                    Object.keys(graphData.nodePositions).length, 'nodes');

                                setupRoomInteractivity(svgMap, rooms, graphData, buildingName);
                                setupExitInteractivity(svgMap, exits, graphData, buildingName);
                            }, 100);
                        } else {
                            console.log(`ℹ️ No navigation graph for ${buildingName} floor ${floorKey}`);
                        }
                        
                        loadedCount++;
                        console.log(`✅ ${buildingName} loaded (${loadedCount}/${totalBuildings})`);
                    })
                    .catch(err => {
                        console.error(`❌ Error loading ${buildingName}:`, err);
                        skippedCount++;
                    });
            });
            
            // Log summary after a delay (since loading is async)
            setTimeout(() => {
                console.log(`\n🎉 Floor ${floorKey} loading complete!`);
                console.log(`   ✅ Loaded: ${loadedCount} buildings`);
                console.log(`   ⚠️ Skipped: ${skippedCount} buildings`);
            }, 2000);
        }
        

        function buildBuildingCache() {
            console.log("RUNNING BUILD CACHE");
            if (!window.geojsonData) {
                console.error("Cannot build cache - GeoJSON not loaded");
                return;
            }
            
            window.geojsonData.features.forEach(f => {
                if (f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon") {
                    const layer = L.geoJSON(f);
                    const bounds = layer.getBounds();
                    const buildingName = f.properties.name || "Unknown Building";
                    
                    window.buildingInfoCache[buildingName] = {
                        bounds: bounds,
                        layer: layer,
                        feature: f
                    };
                    
                    console.log(buildingName, "center:", bounds.getCenter());
                }
            });
        }
        
        function findPathAcrossBuildings(startBuilding, startFloor, endBuilding, endFloor, destinationNodeId) {
            console.log(`🗺️ Finding path: ${startBuilding} Floor ${startFloor} → ${endBuilding} Floor ${endFloor}`);
            console.log(`   Destination node: ${destinationNodeId}`);
            console.log(`   User position:`, window.userPosition);
            
            // Case 1: Same building, same floor - simple pathfinding
            if (startBuilding === endBuilding && startFloor === endFloor) {
                console.log("✅ Same building/floor - using simple pathfinding");
                const graphData = window.buildingGraphData[startBuilding];
                
                if (!graphData) {
                    console.error(`❌ No graph data for ${startBuilding}`);
                    return null;
                }
                
                const startNode = findNearestNodeToUser(window.userPosition, graphData.nodePositions);
                const path = findShortestPath(graphData.graph, startNode, destinationNodeId);
                
                return {
                    type: 'single-building',
                    path: path,
                    building: startBuilding,
                    floor: startFloor
                };
            }
            
            // Case 2: Different buildings - need to connect
            if (startBuilding !== endBuilding) {
                console.log("🌉 Different buildings - checking connections");
                console.log("Available connections:", window.buildingConnections);
                
                const connection = window.buildingConnections[startBuilding]?.[endBuilding];
                
                if (!connection) {
                    console.error(`❌ No connection defined between ${startBuilding} and ${endBuilding}`);
                    console.log(`   Available from ${startBuilding}:`, window.buildingConnections[startBuilding]);
                    alert(`Cannot find route between ${startBuilding} and ${endBuilding}`);
                    return null;
                }
                
                console.log("✅ Found connection:", connection);
                
                // Path segment 1: User position → exit node in current building
                const startGraphData = window.buildingGraphData[startBuilding];
                if (!startGraphData) {
                    console.error(`❌ No graph data for start building: ${startBuilding}`);
                    return null;
                }
                
                const startNode = findNearestNodeToUser(window.userPosition, startGraphData.nodePositions);
                console.log(`   Start node: ${startNode} → Exit node: ${connection.exitNode}`);
                
                const pathToExit = findShortestPath(startGraphData.graph, startNode, connection.exitNode);
                
                if (!pathToExit) {
                    console.error(`❌ Could not find path to exit in ${startBuilding}`);
                    return null;
                }
                console.log(`✅ Path to exit (${pathToExit.length} nodes):`, pathToExit);
                
                // Path segment 2: entry node in destination building → destination
                const endGraphData = window.buildingGraphData[endBuilding];
                if (!endGraphData) {
                    console.error(`❌ No graph data for end building: ${endBuilding}`);
                    return null;
                }
                
                console.log(`   Entry node: ${connection.entryNode} → Destination: ${destinationNodeId}`);
                const pathToDestination = findShortestPath(endGraphData.graph, connection.entryNode, destinationNodeId);
                
                if (!pathToDestination) {
                    console.error(`❌ Could not find path from entry to destination in ${endBuilding}`);
                    return null;
                }
                console.log(`✅ Path to destination (${pathToDestination.length} nodes):`, pathToDestination);
                
                return {
                    type: 'multi-building',
                    segments: [
                        {
                            building: startBuilding,
                            floor: startFloor,
                            path: pathToExit,
                            description: `Navigate to ${endBuilding} connector`
                        },
                        {
                            building: endBuilding,
                            floor: endFloor,
                            path: pathToDestination,
                            description: `Navigate to destination in ${endBuilding}`
                        }
                    ],
                    connection: connection
                };
            }
            
            // Case 3: Same building, different floors (TODO: implement later)
            console.warn("⚠️ Multi-floor navigation not yet implemented");
            return null;
        }
        
        function findNearestNodeToUser(userPos, nodePositions) {
            let nearestNode = null;
            let minDistance = Infinity;
            
            Object.entries(nodePositions).forEach(([nodeId, nodePos]) => {
                const distance = userPos.distanceTo(nodePos);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestNode = nodeId;
                }
            });
            
            console.log(`📍 Nearest node to user: ${nearestNode} (${minDistance.toFixed(2)}m away)`);
            return nearestNode;
        }

            const step = 0.00005; // Small step for fine adjustments
            let latOffset = parseFloat(document.getElementById('latOffset').value) || 0;
            let lngOffset = parseFloat(document.getElementById('lngOffset').value) || 0;
            
            switch(e.key) {
                case 'ArrowUp':
                    latOffset += step;
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                    latOffset -= step;
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                    lngOffset -= step;
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                    lngOffset += step;
                    e.preventDefault();
                    break;
                default:
                    return;
            }
            
            document.getElementById('latOffset').value = latOffset.toFixed(6);
            document.getElementById('lngOffset').value = lngOffset.toFixed(6);
            updateOverlayPosition();
        });

        async function initApp() {
            

            window.currentOverlays = [];

            window.hallwayLatLngs = [];

            console.log("GeoJSON data loaded:", window.geojsonData);
            console.log("Building connections loaded:", window.buildingConnections);

            const mapBearing = 0
            window.map = L.map('map', {
                maxZoom: 22,   // allow very close zoom
                minZoom: 16,
                rotate: true,
                bearing: mapBearing,
                touchRotate: true,
                shiftKeyRotate: true
            }).setView([43.0125, -81.2002], 18);


            setupOverlayDrag();

            map.on('mousedown touchstart', function() {
