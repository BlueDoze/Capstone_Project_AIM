                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                window.buildingConnections = await response.json();
                console.log("Building connections loaded:", window.buildingConnections);
            } catch (error) {
                console.error('Failed to load building connections:', error);
                window.buildingConnections = {}; // Fallback to empty object
            }
        }

        // Continue to next floor after using stairs/elevator (Global function)
        async function continueToNextFloor() {
            if (!window.pendingDestination) {
                alert("No pending multi-floor navigation");
                return;
            }
            
            const dest = window.pendingDestination;
            console.log(`🔄 Continuing to Floor ${dest.endFloor}:`, dest);
            console.log(`🔍 Will look for connector: "${dest.connectorId}"`);
            
            // Show loading state
            const floorInstructions = document.getElementById('floorInstructions');
            const continueBtn = document.getElementById('continueFloorBtn');
            const originalInstructions = floorInstructions.innerHTML;
            const originalBtnText = continueBtn.innerHTML;
            
            floorInstructions.innerHTML = '⏳ Loading floor plan, please wait...';
            continueBtn.disabled = true;
            continueBtn.style.opacity = '0.5';
            
            try {
                // Switch to destination floor
                window.userCurrentFloor = dest.endFloor;
                document.getElementById('floor-selector').value = dest.endFloor;
                
                // Wait for floor to load completely
                await loadFloorLevel(parseInt(dest.endFloor));
                console.log('✅ Floor loading complete, proceeding with navigation');
                const graphData = window.buildingGraphData[dest.building];
                if (!graphData) {
                    alert("Navigation graph not loaded for this floor");
                    floorInstructions.innerHTML = originalInstructions;
                    continueBtn.disabled = false;
                    continueBtn.style.opacity = '1';
                    return;
                }
                
                const endFloorData = window.floorPlans[dest.building]?.floors?.[dest.endFloor];
                if (!endFloorData) {
                    alert("Floor data not found");
                    floorInstructions.innerHTML = originalInstructions;
                    continueBtn.disabled = false;
                    continueBtn.style.opacity = '1';
                    return;
                }
                
                // Get the SVG element for this building
                const svgMap = window.buildingSVGElements[dest.building];
                if (!svgMap) {
                    alert(`SVG not loaded for ${dest.building}`);
                    floorInstructions.innerHTML = originalInstructions;
                    continueBtn.disabled = false;
                    continueBtn.style.opacity = '1';
                    return;
                }
                
                console.log(`🔍 Floor ${dest.endFloor} data loaded. Looking for connector: "${dest.connectorId}"`);
                console.log(`📋 Available in exitToNode:`, Object.keys(endFloorData.exitToNode || {}));
                console.log(`📋 Available in verticalConnectors:`, Object.keys(endFloorData.verticalConnectors || {}));
                
                // Use exitToNode to find the connector node (most reliable method)
                let connectorNodeId = null;
                
                // First try exitToNode - this maps connector IDs directly to node IDs
                const exitNodes = endFloorData.exitToNode?.[dest.connectorId];
                if (exitNodes && exitNodes.length > 0) {
                    connectorNodeId = exitNodes[0];
                    console.log(`📍 Found connector via exitToNode: ${dest.connectorId} at node ${connectorNodeId}`);
                } else {
                    // Fallback: try verticalConnectors dictionary
                    const connector = endFloorData.verticalConnectors?.[dest.connectorId];
                    if (connector) {
                        connectorNodeId = connector.nodeId;
                        console.log(`📍 Found connector via verticalConnectors: ${dest.connectorId} at node ${connectorNodeId}`);
                    } else {
                        alert(`Could not find connector "${dest.connectorId}" on Floor ${dest.endFloor}`);
                        console.error("Available in exitToNode:", Object.keys(endFloorData.exitToNode || {}));
                        console.error("Available in verticalConnectors:", Object.keys(endFloorData.verticalConnectors || {}));
                        return;
                    }
                }
                
                // Update user position to the connector node position
                const connectorPos = graphData.nodePositions[connectorNodeId];
                if (connectorPos) {
                    window.userPosition = connectorPos;
                    if (window.userMarker) {
                        window.userMarker.setLatLng(connectorPos);
                    }
                }
                
                // Step 2: Navigate on the destination floor from connector to final destination
                // We do SINGLE-FLOOR navigation only (not multi-floor)
                console.log(`🎯 Step 2: Navigating on Floor ${dest.endFloor} from ${connectorNodeId} to ${dest.roomId}`);
                
                // Get destination node on Floor 2
                const destNodeArray = endFloorData.roomToNode[dest.roomId];
                if (!destNodeArray || destNodeArray.length === 0) {
                    alert(`Could not find room ${dest.roomId} on Floor ${dest.endFloor}`);
                    return;
                }
                const destinationNodeId = destNodeArray[0];
                console.log(`📍 Destination node: ${destinationNodeId}`);
                
                // Find path on Floor 2 from connector to destination
                const path = findShortestPath(graphData.graph, connectorNodeId, destinationNodeId);
                if (!path || path.length === 0) {
                    alert(`Could not find path from ${connectorNodeId} to ${destinationNodeId} on Floor ${dest.endFloor}`);
                    return;
                }
                
                console.log(`✅ Found path on Floor ${dest.endFloor}:`, path);
                
                // Get the building overlay for Floor 2
                const buildingOverlay = window.buildingOverlays[dest.building];
                
                // Get destination room door list
                const destFloorData = endFloorData;
                const destDoorList = destFloorData.objects?.rooms?.[dest.roomId];
                
                // Find closest door to final node position
                let finalDoorId = null;
                if (destDoorList && destDoorList.length > 0 && dest.objectType === 'room') {
                    const lastNodePos = graphData.nodePositions[path[path.length - 1]];
                    finalDoorId = findClosestDoorToPosition(destDoorList, svgMap, buildingOverlay, lastNodePos);
                    console.log(`🚪 Selected destination door: ${finalDoorId}`);
                }
                
                // Draw the path on the map
                drawPathOnMap(
                    path, 
                    graphData.nodePositions, 
                    map, 
                    svgMap, 
                    true, 
                    finalDoorId, // Use selected door
                    buildingOverlay, 
                    null, // No user position
                    null, // No start door
                    dest.connectorId, // Vertical connector ID
                    false, // Not first floor segment
                    true // Is last floor segment
                );
                
                // Hide multi-floor panel
                document.getElementById('multiFloorPanel').style.display = 'none';
                window.pendingDestination = null;
                
            } catch (error) {
                console.error('❌ Error during floor transition:', error);
                alert('Failed to load floor plan. Please try again.');
                
                // Restore UI state
                floorInstructions.innerHTML = originalInstructions;
                continueBtn.disabled = false;
                continueBtn.style.opacity = '1';
            }
        }

         // Step 1: Initialize the map
        async function initApp() {
            

            window.currentOverlays = [];
            window.buildingInfoCache = {};
            window.geojsonData = null;
            window.currentOverlay = null;
            window.hallwayLatLngs = [];
            window.currentPathLine = null;
            window.buildingGraphData = {};
            window.buildingSVGElements = {};
            window.pathPolylines = [];

            

            window.isDragging = false;
            window.dragStartTime = 0;

            await loadFloorPlans();
            await loadBuildingPositions();
            await loadGeoJSON();
            await loadBuildingConnections();

            console.log("Floor plans loaded:", window.floorPlans);
            console.log("Building positions loaded:", window.buildingPositions);
            console.log("GeoJSON data loaded:", window.geojsonData);
            console.log("Building connections loaded:", window.buildingConnections);

            const mapBearing = 0
            window.map = L.map('map', {
                maxZoom: 22,   // allow very close zoom
                minZoom: 16,
                rotate: true,
                bearing: mapBearing,
                touchRotate: true,
                shiftKeyRotate: true
            }).setView([43.0125, -81.2002], 18);


            setupOverlayDrag();

            //Mouse handling logic to distinguish drag vs click
            map.on('mousedown touchstart', function() {
                window.isDragging = false;
                window.dragStartTime = Date.now();
            });

            map.on('mousemove touchmove', function() {
                if (Date.now() - window.dragStartTime > 100) { // If movement lasts > 100ms, it's a drag
                    window.isDragging = true;
                }
            });

            map.on('mouseup touchend', function() {
                setTimeout(() => {
                    window.isDragging = false;
                }, 50); // Small delay to ensure click events see the drag state
            });

            // Step 2: Add tile layer (the actual map)
            L.tileLayer(
                "https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=d3JSA6Uq18jaERqMgDqq",
                {
                attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
                maxZoom: 22
                }
            ).addTo(map);
            


            window.currentOverlay = null;

            window.hallwayLatLngs = []; // store hallway nodes globally
            window.currentPathLine = null;

            
            // Step 3: Load GeoJSON buildings

            if (window.geojsonData){
                window.geojsonData.features.forEach(feature => {
                    if (feature.geometry.type === "Polygon" || feature.geometry.type === "MultiPolygon") {
                        const tempLayer = L.geoJSON(feature);
                        const bounds = tempLayer.getBounds();
                        const buildingName = feature.properties.name || "Unknown Building";
                        
                        if (buildingName !== "Unknown Building") {
                            window.buildingInfoCache[buildingName] = {
                                layer: tempLayer,
                                bounds: bounds,
                                feature: feature
                            };
                            console.log("✅ Cached:", buildingName);
                        }
                    }
                });

                L.geoJSON(window.geojsonData, {
                        style: {
                            color: "blue",
                            weight: 2,
                            fillOpacity: 0.2
                        },
                        onEachFeature: function(feature, layer) {
                            let buildingName = feature.properties.name || "Unknown Building";
                            layer.bindPopup("<b>" + buildingName + "</b>");
                            
                            // Optional: Add click handler for individual building zoom
                            layer.on('click', function() {
                                const bounds = layer.getBounds();
                                map.fitBounds(bounds);
                            });
                        }
                    }).addTo(map);
                }

                // Load the first floor on startup
                // await loadFloorLevel(1);
                // createUserMarker(L.latLng(43.0143425, -81.19856355)); // Starting position in M building
                // updateUserLocation();
                showStartupModal();


                // Multi-Floor Navigation Function
                function navigateMultiFloor(destinationRoomId, objectType, building, startFloor, endFloor) {
                    console.log(`🏢 Multi-floor navigation: ${building} Floor ${startFloor} → Floor ${endFloor} to ${destinationRoomId}`);
                    
                    // Get vertical connectors for the start floor
                    const startFloorData = window.floorPlans[building]?.floors?.[startFloor];
                    if (!startFloorData || !startFloorData.verticalConnectors) {
                        alert(`No vertical connectors found on ${building} Floor ${startFloor}`);
                        return;
                    }
                    
                    // Convert verticalConnectors dict to array and find connectors that go to the target floor
                    const validConnectors = Object.values(startFloorData.verticalConnectors).filter(conn => 
                        conn.goesTo.some(floor => floor.includes(endFloor))
                    );
                    
                    if (validConnectors.length === 0) {
                        alert(`No stairs or elevators found that connect Floor ${startFloor} to Floor ${endFloor}`);
                        return;
                    }
                    
                    console.log(`✅ Found ${validConnectors.length} vertical connectors:`, validConnectors.map(c => c.id));
                    
                    // Find the nearest connector to user's current position
                    let nearestConnector = null;
                    let shortestPath = null;
                    let shortestDistance = Infinity;
                    
                    const graphData = window.buildingGraphData[building];
                    if (!graphData) {
                        alert(`Navigation graph not found for ${building}`);
                        return;
                    }
                    
                    // Get user's current node - use user position and node positions
                    const startNodeId = findNearestNodeToUser(window.userPosition, graphData.nodePositions);
                    if (!startNodeId) {
                        alert("Cannot find your current position on the navigation graph");
                        return;
                    }
                    
                    console.log(`📍 Starting from node: ${startNodeId}`);
                    
                    // Try each connector and find the closest one
                    for (const connector of validConnectors) {
                        const path = findShortestPath(graphData.graph, startNodeId, connector.nodeId);
                        if (path && path.length > 0) {
                            const distance = calculatePathDistance(path, graphData.nodePositions);
                            if (distance < shortestDistance) {
                                shortestDistance = distance;
                                shortestPath = path;
                                nearestConnector = connector;
                            }
                        }
                    }
                    
                    if (!nearestConnector || !shortestPath) {
                        alert("Cannot find a path to any stairs or elevator");
                        return;
                    }
                    
                    console.log(`✅ Nearest connector: ${nearestConnector.id} (${nearestConnector.type}) at node ${nearestConnector.nodeId}`);
                    
                    // Draw path to the connector on current floor
                    const svgMap = window.buildingSVGElements[building];
                    const buildingOverlay = window.buildingOverlays?.[building];
                    
                    if (svgMap && buildingOverlay) {
                        // Get starting door (first door of starting room)
                        const startDoorId = window.startingRoomDoorList && window.startingRoomDoorList.length > 0 
                            ? window.startingRoomDoorList[0] 
                            : null;
                        
                        drawPathOnMap(
                            shortestPath, 
                            graphData.nodePositions, 
                            map, 
                            svgMap, 
                            true, 
                            null, // No final object on first floor segment
                            buildingOverlay, 
                            null, // Don't use user position if we have start door
                            startDoorId, // Starting door
                            nearestConnector.id, // Vertical connector ID
                            true, // Is first floor segment
                            false // Not last floor segment
                        );
                        
                        // Show multi-floor instructions and button
                        const connectorName = nearestConnector.type === 'elevator' ? 'Elevator' : 'Stairs';
                        
                        // Store destination info for when user reaches the next floor
                        // Use verticalConnections dict to look up connector ID by floor number
                        const destConnectorId = nearestConnector.verticalConnections?.[endFloor];
                        
                        console.log(`🔍 Looking up connector for floor ${endFloor} in:`, nearestConnector.verticalConnections);
                        console.log(`📋 Destination connector ID: ${destConnectorId}`);
                        
                        window.pendingDestination = {
                            roomId: destinationRoomId,
                            objectType: objectType,
                            building: building,
                            startFloor: startFloor,
                            endFloor: endFloor,
                            connectorId: destConnectorId,
                            connectorType: nearestConnector.type,
                            connectorNodeId: nearestConnector.nodeId
                        };
                        
                        console.log("💾 Stored pending destination:", window.pendingDestination);
                        
                        // Show the continue button
                        const continueBtn = document.getElementById('continueFloorBtn');
                        const instructions = document.getElementById('floorInstructions');
                        
                        if (continueBtn && instructions) {
                            instructions.innerHTML = `<strong>Step 1:</strong> Follow path to ${nearestConnector.id}<br>
                                                     <strong>Step 2:</strong> Take ${connectorName} to Floor ${endFloor}<br>
                                                     <strong>Step 3:</strong> Click button below when you arrive`;
                            continueBtn.style.display = 'block';
                            document.getElementById('multiFloorPanel').style.display = 'block';
                        }
                    }
                }
                
                // Helper function to calculate path distance
                function calculatePathDistance(path, nodePositions) {
                    let distance = 0;
                    for (let i = 0; i < path.length - 1; i++) {
                        const pos1 = nodePositions[path[i]];
                        const pos2 = nodePositions[path[i + 1]];
                        if (pos1 && pos2) {
                            const dx = pos2.lat - pos1.lat;
                            const dy = pos2.lng - pos1.lng;
                            distance += Math.sqrt(dx * dx + dy * dy);
                        }
                    }
                    return distance;
                }

                
                // Set Start Position Button
                document.getElementById("setStartBtn").addEventListener("click", () => {
                    const roomId = document.getElementById("startObjectId").value.trim().toUpperCase();
                    
                    if (!roomId) {
                        alert("Please enter your current room ID");
                        return;
                    }
                    
                    console.log(`🔍 Setting start location: ${roomId}`);
                    
                    // Search for the room
                    let found = false;
                    let roomBuilding = null;
                    let roomFloor = null;
                    let doorList = null;
                    
                    for (const [buildingName, buildingData] of Object.entries(window.floorPlans)) {
                        for (const [floorNum, floorData] of Object.entries(buildingData.floors)) {
                            if (floorData.objects?.rooms?.[roomId]) {
                                found = true;
                                roomBuilding = buildingName;
                                roomFloor = floorNum;
                                doorList = floorData.objects.rooms[roomId];
                                break;
                            }
                        }
                        if (found) break;
                    }
                    
                    if (!found) {
                        alert(`Room "${roomId}" not found. Please check the room ID.`);
                        return;
                    }
                    
                    console.log(`✅ Found ${roomId} in ${roomBuilding}, Floor ${roomFloor}`);
                    
                    // Set user location
                    window.userCurrentBuilding = roomBuilding;
                    window.userCurrentFloor = roomFloor;
                    
                    // Store starting room information for navigation
                    window.startingRoomId = roomId;
                    window.startingRoomDoorList = doorList;
                    window.startingRoomBuilding = roomBuilding;
                    console.log(`💾 Stored starting room: ${roomId} with ${doorList.length} doors`);
                    
                    // Load floor and set position
                    document.getElementById('floor-selector').value = roomFloor;
                    loadFloorLevel(parseInt(roomFloor));
                    
                    setTimeout(() => {
                        const svgElement = window.buildingSVGElements[roomBuilding];
                        const buildingOverlay = window.buildingOverlays[roomBuilding];
                        
                        if (svgElement && buildingOverlay && doorList && doorList.length > 0) {
                            const firstDoor = svgElement.getElementById(doorList[0]);
                            if (firstDoor) {
                                const doorPosition = objectToLatLng(firstDoor, svgElement, buildingOverlay);
                                
                                // Remove existing marker if present
                                if (window.userMarker) {
                                    map.removeLayer(window.userMarker);
                                    window.userMarker = null;
                                }
                                
                                // Set user position (but don't show marker yet)
                                window.userPosition = doorPosition;
                                map.setView(doorPosition, 19);
                                
                                // Show success message
                                const statusDiv = document.getElementById('navStatus');
                                statusDiv.textContent = `✅ Location confirmed: ${roomId} (${roomBuilding}, Floor ${roomFloor})`;
                                statusDiv.style.display = 'block';
                                statusDiv.style.background = '#d4edda';
                                statusDiv.style.color = '#155724';
                                
                                // Hide Step 1, Show Step 2
                                document.getElementById('navStep1').style.display = 'none';
                                document.getElementById('navStep2').style.display = 'block';
                                
                                console.log(`✅ Start location confirmed, ready for destination`);
                            }
                        }
                    }, 1000);
                });
                
                // Change Start Location Button
                document.getElementById("changeStartBtn").addEventListener("click", () => {
                    // Clear any existing path
                    clearPath();
                    
                    // Reset to Step 1
                    document.getElementById('navStep1').style.display = 'block';
                    document.getElementById('navStep2').style.display = 'none';
                    
                    // Clear status
                    const statusDiv = document.getElementById('navStatus');
                    statusDiv.style.display = 'none';
                    statusDiv.textContent = '';
                    
                    // Clear inputs
                    document.getElementById('startObjectId').value = '';
                    document.getElementById('destinationObjectId').value = '';
                    
                    // Clear starting room state
                    window.startingRoomId = null;
                    window.startingRoomDoorList = null;
                    window.startingRoomBuilding = null;
                    
                    console.log("↩️ Returning to start location selection");
                });
                
                // Navigate to Destination Button
                document.getElementById("navigateBtn").addEventListener("click", () => {
                    const objectId = document.getElementById("destinationObjectId").value.trim().toUpperCase();
                    
                    if (!objectId) {
                        alert("Please enter a destination room ID");
                        return;
                    }
                    
                    console.log(`🔍 Searching for destination: ${objectId}`);
                    
                    // Try to extract building/floor from the ID itself
                    const extracted = extractBuildingFloor(objectId);
                    let targetBuilding = extracted.building;
                    let targetFloor = extracted.floor;
                    let objectType = 'room';
                    
                    // If extraction failed, search through all floors
                    if (!targetBuilding || !targetFloor) {
                        let found = false;
                        for (const [buildingName, buildingData] of Object.entries(window.floorPlans)) {
                            for (const [floorNum, floorData] of Object.entries(buildingData.floors)) {
                                // Check rooms
                                if (floorData.objects?.rooms?.[objectId]) {
                                    found = true;
                                    targetBuilding = buildingName;
                                    targetFloor = floorNum;
                                    objectType = 'room';
                                    break;
                                }
                                // Check exits
                                if (floorData.objects?.exits?.[objectId]) {
                                    found = true;
                                    targetBuilding = buildingName;
                                    targetFloor = floorNum;
                                    objectType = 'exit';
                                    break;
                                }
                            }
                            if (found) break;
                        }
                        
                        if (!found) {
                            alert(`Object "${objectId}" not found.`);
                            return;
                        }
                    }
                    
                    console.log(`✅ Found ${objectId} in ${targetBuilding}, Floor ${targetFloor}`);
                    
                    // Check if we need multi-floor navigation
                    const currentBuilding = window.userCurrentBuilding || targetBuilding;
                    const currentFloor = window.userCurrentFloor || targetFloor;
                    
                    if (currentBuilding === targetBuilding && currentFloor !== targetFloor) {
                        // Multi-floor navigation in same building
                        console.log(`🔄 Multi-floor navigation: Floor ${currentFloor} → Floor ${targetFloor}`);
                        navigateMultiFloor(objectId, objectType, targetBuilding, currentFloor, targetFloor);
                    } else {
                        // Same floor or different building
                        navigateToObject(objectId, objectType, targetBuilding, targetFloor);
                    }
                });
        }
        initApp();
		
    </script>
