version: '3.8'

services:
  web:
    build: .
    container_name: fanshawe-navigator
    ports:
      - "8081:8081"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=production
      - PORT=8081
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./LeafletJS:/app/LeafletJS:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
